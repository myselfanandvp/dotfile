onboarding = false

[ui]
agent_panel_sort = "spaces"

[theme]
name = "gruvbox"
auto_switch = false


[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"

[theme.custom]
accent = "#7aa2f7"
panel_bg = "reset"
sidebar_bg = "reset"
active_row_bg = "#272c42"
selection_bg = "#2e344f"
surface0 = "#272c42"
surface1 = "#2e344f"
surface_dim = "#1c1f2e"
overlay0 = "#66709b"
overlay1 = "#787c99"
text = "#c0caf5"
subtext0 = "#787c99"
mauve = "#bb9af7"
green = "#73daca"
yellow = "#e0af68"
red = "#f7768e"
blue = "#7aa2f7"
teal = "#7dcfff"
peach = "#f79f76"
