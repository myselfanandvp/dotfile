onboarding = false

[ui]
agent_panel_sort = "spaces"

[theme]
name = "gruvbox"
auto_switch = false


[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"

[theme.custom]
accent = "#7dc4e4"
panel_bg = "reset"
sidebar_bg = "reset"
active_row_bg = "#3e435b"
selection_bg = "#474c67"
surface0 = "#3e435b"
surface1 = "#474c67"
surface_dim = "#1c1f2d"
overlay0 = "#6e738d"
overlay1 = "#a5adcb"
text = "#cad3f5"
subtext0 = "#a5adcb"
mauve = "#f5bde6"
green = "#a6da95"
yellow = "#eed49f"
red = "#ed8796"
blue = "#8aadf4"
teal = "#8bd5ca"
peach = "#edab87"
