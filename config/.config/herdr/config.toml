onboarding = false

[ui]
agent_panel_sort = "spaces"

[theme]
name = "gruvbox"
auto_switch = false


[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"

[theme.custom]
accent = "#7aa2f7"
panel_bg = "reset"
sidebar_bg = "reset"
active_row_bg = "#2c3148"
selection_bg = "#333954"
surface0 = "#2c3148"
surface1 = "#333954"
surface_dim = "#12121a"
overlay0 = "#5d6682"
overlay1 = "#9aa5ce"
text = "#c0caf5"
subtext0 = "#9aa5ce"
mauve = "#bb9af7"
green = "#9ece6a"
yellow = "#e0af68"
red = "#f7768e"
blue = "#7aa2f7"
teal = "#7dcfff"
peach = "#f79f76"
