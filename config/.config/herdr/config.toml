onboarding = false

[ui]
agent_panel_sort = "spaces"

[theme]
name = "gruvbox"
auto_switch = false


[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"

[theme.custom]
accent = "#76946a"
panel_bg = "reset"
sidebar_bg = "reset"
active_row_bg = "#333343"
selection_bg = "#3c3c4e"
surface0 = "#333343"
surface1 = "#3c3c4e"
surface_dim = "#16161d"
overlay0 = "#68697a"
overlay1 = "#717c7c"
text = "#c8c093"
subtext0 = "#717c7c"
mauve = "#957fb8"
green = "#76946a"
yellow = "#c0a36e"
red = "#c34043"
blue = "#7e9cd8"
teal = "#6a9589"
peach = "#c37e40"
