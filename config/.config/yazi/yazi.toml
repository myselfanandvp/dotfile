[opener]
edit = [{ run = "kitty -e nvim %s", orphan = true, for = "unix" }]
play = [{ run = "mpv %s", orphan = true, for = "unix" }]
pdf_viewer = [{ run = "zathura %s", orphan = true, for = "unix" }]
image_viewer = [{ run = "loupe %s", orphan = true, for = "unix" }]

[open]
prepend_rules = [
  { url = "*.json", use = "edit" },
  { url = "*.html", use = "edit" },
  { url = "*.pdf", use = "pdf_viewer" },
  { url = "*.{jpg,jpeg,png,webp,avif,gif,svg,bmp,ico}", use = "image_viewer" },
]

[[plugin.prepend_fetchers]]
url = "*"
run = "git"
group = "git"

[[plugin.prepend_fetchers]]
url = "*/"
run = "git"
group = "git"
