[Autologin]
#Relogin=false
#Session=
#User=

[General]
#EnableHiDPI=false
#HaltCommand=/usr/bin/systemctl poweroff
#Numlock=none
#RebootCommand=/usr/bin/systemctl reboot
#DisplayServer=wayland

[Theme]
Current=win11sddm
CursorTheme=volantes_cursors
#DisableAvatarsThreshold=7
#EnableAvatars=true
#FacesDir=/usr/share/sddm/faces
#ThemeDir=/usr/share/sddm/themes

[Users]
#DefaultPath=/usr/local/bin:/usr/bin:/bin
#HideShells=
#HideUsers=
#MaximumUid=60000
#MinimumUid=1000
#RememberLastSession=true
#RememberLastUser=true

[Wayland]
#SessionCommand=/etc/sddm/wayland-session
#SessionDir=/usr/share/wayland-sessions
#SessionLogFile=.cache/wayland-errors

[X11]
#DisplayCommand=/etc/sddm/Xsetup
#DisplayStopCommand=/etc/sddm/Xstop
#MinimumVT=1
#ServerArguments=-nolisten tcp
#ServerPath=/usr/bin/X
#SessionCommand=/etc/X11/xinit/Xsession
#SessionDir=/usr/share/xsessions
#SessionLogFile=.cache/xsession-errors
#UserAuthFile=.Xauthority
#XauthPath=/usr/bin/xauth
#XephyrPath=/usr/bin/Xephyr
