config_version = 16

[audio]
enable_sounds = true

[backdrop]
blur_intensity = 0.15999999642372131
tint_intensity = 0.19999999552965164

[bar.default]
background_opacity = 0.87999998033046722
border_width = 1.5
end = [
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "widget_3",
    "volume",
    "brightness",
    "battery",
    "control-center",
    "session"
]
layer = "overlay"
margin_edge = 1
radius = 7
reserve_space = false
smart_auto_hide = true
start = [ "launcher", "wallpaper", "workspaces", "cpu", "bar", "media", "audio_visualizer" ]

[battery]
warning_threshold = 50

[brightness]
enable_ddcutil = true
sync_all_monitors = true

[desktop_widgets]
schema_version = 2
widget_order = [ "desktop-widget-0000000000000001" ]

    [desktop_widgets.grid]
    cell_size = 24
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 192.0
    box_width = 312.0
    cx = 1680.0
    cy = 900.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "weather"

        [desktop_widgets.widget.desktop-widget-0000000000000001.settings]
        background = false
        background_color = "on_primary"
        color = "on_surface_variant"
        font_family = "JetBrains Mono"
        show_forecast = true

[dock]
border_width = 1.5
enabled = true
icon_size = 20
inactive_scale = 1.0
launcher_position = "start"
margin_edge = 1
pinned = [ "kitty", "brave-browser" ]
radius = 10
radius_bottom_left = 5
radius_bottom_right = 5
radius_top_left = 5
radius_top_right = 5
reserve_space = false
shadow = false
show_dots = true
smart_auto_hide = true

[hot_corners]
enabled = true

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = false
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 720.0
    cx = 683.00006103515625
    cy = 586.0001220703125
    output = "HDMI-A-1"
    placement_height = 768.0
    placement_width = 1366.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = true

[notification]
background_opacity = 0.69999998435378075
offset_y = 40

[osd]
background_opacity = 0.99999997764825821
offset_y = 40
position_vertical = "bottom_center"

[plugin_settings."noctalia/notes"]
panel_placement = "attached"
panel_position = "top_right"

[plugin_settings."yocraft/qrcode"]
notify = "all"

[plugin_settings."yuuto/calculator"]
panel_placement = "floating"
panel_position = "center"

[plugins]
enabled = [ "noctalia/notes", "jinliu/imagemagick-clock" ]

[shell]
font_family = "JetBrains Mono SemiBold"
polkit_agent = true

    [shell.launcher]
    categories = false
    layout = "simple"

    [shell.panel]
    session_placement = "floating"
    transparency_mode = "soft"
    wallpaper_placement = "floating"
    wallpaper_position = "center"

[system.monitor]
gpu_poll_seconds = 1

[theme]
builtin = "Kanagawa"
community_palette = "Catppuccin Macchiato Sapphire"
mode = "dark"
source = "community"
wallpaper_scheme = "muted"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "gtk3", "gtk4", "ghostty", "hyprland", "kcolorscheme", "kitty", "qt", "wezterm" ]
    community_ids = [ "brave", "qutebrowser", "zen-browser", "telegram", "fastfetch", "zathura", "papirus-icons", "herdr", "yazi" ]

[wallpaper]
directory = "/home/anand/Pictures/Wallpapers"
directory_dark = "/home/anand/Pictures/Wallpapers"
directory_light = "/home/anand/Pictures/Wallpapers"
edge_smoothness = 0.44999998994171619
transition = [ "disc" ]
transition_duration = 1900

    [wallpaper.default]
    path = "/home/anand/Pictures/Wallpapers/desert-meets-ocean-surreal-landscape-aerial-view-desktop-wallpaper-variant_1k.jpg"

    [wallpaper.last]
    path = "/home/anand/Pictures/Wallpapers/desert-meets-ocean-surreal-landscape-aerial-view-desktop-wallpaper-variant_1k.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/anand/Pictures/Wallpapers/desert-meets-ocean-surreal-landscape-aerial-view-desktop-wallpaper-variant_1k.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/anand/Pictures/Wallpapers/desert-meets-ocean-surreal-landscape-aerial-view-desktop-wallpaper-variant_1k.jpg"

[widget.audio_visualizer]
color = "secondary"
color_1 = "tertiary"
color_2 = "secondary"
font_family = "JetBrains Mono Medium"
icon_color = "tertiary"

[widget.bar]
type = "yuuto/calculator:bar"

[widget.clock]
format = "{:%I:%M %P}"

[widget.control-center]
glyph = "settings"

[widget.media]
album_art_only = true
capsule = true
capsule_fill = "on_secondary"
color = "secondary"
font_family = "JetBrainsMonoNL NF Medium"
font_weight = 500
hide_when_no_media = true
icon_color = "tertiary"
max_length = 122
min_length = 94
show_progress = true

[widget.widget_3]
type = "autumn/network-toolkit:widget"

[widget.workspaces]
focused_color = "tertiary"
occupied_color = "primary"
style = "minimal"